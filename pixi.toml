[workspace]
name = "varchamp-image-qc"
version = "0.1.0"
description = "Grep & visualize high-quality Cell Painting images from the VarChamp project (cpg0020, Batch 13)"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

# Conda-forge stack — smooth wheels for scientific TIFF/S3 I/O.
[dependencies]
python = "3.11.*"
marimo = ">=0.9"
polars = ">=1.8"
numpy = "*"
scikit-image = "*"
tifffile = "*"
imagecodecs = "*"      # required to decode the compressed TIFFs from the gallery
matplotlib = "*"
pillow = "*"
boto3 = "*"
botocore = "*"         # unsigned (anonymous) S3 access to the public bucket
pyarrow = "*"

[tasks]
edit = "marimo edit notebooks/pick_images.py"
app = "marimo run notebooks/pick_images.py"
sheet = "python scripts/contact_sheet.py"
